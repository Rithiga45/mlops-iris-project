
name: Iris ML Experiment with CML

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  train-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recreate Iris dataset
        run: |
          python -c "from sklearn.datasets import load_iris; import pandas as pd; from pathlib import Path; d=load_iris(); p=Path('data/raw'); p.mkdir(parents=True, exist_ok=True); df=pd.DataFrame(d.data, columns=d.feature_names); df['target']=d.target; df.to_csv(p/'iris.csv', index=False)"

      - name: Install CML
        uses: iterative/setup-cml@v2

      - name: Reproduce ML experiment
        run: |
          dvc repro

      - name: Generate CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# Iris ML Experiment Report" > report.md
          echo "## Model Evaluation" >> report.md
          echo "" >> report.md
          echo '```json' >> report.md
          cat reports/metrics.json >> report.md
          echo '```' >> report.md
          cml comment create report.md
